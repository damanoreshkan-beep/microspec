# Deploy — assemble dist/ (store launcher + apps + shared _rt) and ship it to the VPS (https://dreamstudio.mooo.com/).
# GitHub Pages was retired on 2026-08-16; there is no mirror.
# Runs ONLY after the `verify` gate passes on main (workflow_run), never in parallel with it: this
# (a) never deploys red code, and (b) keeps the two workflows from spinning up ~12 jobs at once, each
# hammering GitHub's action-resolution service (which halves our exposure when GitHub has an outage).
name: deploy
on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # build ~1 min + the dist eye (71 apps in one Chromium) — fail fast beyond that
    # workflow_dispatch → always; workflow_run → only when the verify gate concluded success.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run checks out the default branch by default; pin to the exact commit that passed verify.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0   # full history so build.mjs can derive versions from commit counts
      - uses: ./.github/actions/setup-deno
      - name: Cache deno deps (DENO_DIR, keyed on the lockfile)
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock', 'packages/**/deno.json') }}
          restore-keys: deno-
      - name: Assemble dist/
        run: deno run -A deploy/build.mjs
      # THE EYE ON DIST — a real Chromium opens every app of the BUILT site and MEASURES that the token system is
      # alive (--ms-r on :root, border-radius > 0 on the first kit surface, app.css loaded, no uncaught error),
      # keeping one PNG per app. Exists because verify.yml runs the SOURCE with the CDN, and on 2026-08-14 → 16 the
      # compat build shipped the whole farm without radii/density/accent while every gate stayed green. Red here
      # → nothing is shipped. The PNGs are the taste review's material: the designer (the owner and the agent, in
      # session — no paid API here) downloads `dist-eye` and READS them.
      - name: Eye on dist (real Chromium, measured)
        timeout-minutes: 12
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: deno run -A packages/gates/dist-eye.mjs --dist dist --out dist-eye
      - name: Upload dist shots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dist-eye
          path: dist-eye/
          retention-days: 14
      # THE PRODUCTION HOST is our VPS (https://dreamstudio.mooo.com/, since 2026-08-16): dist/ is rsynced
      # into /srv/www as a restricted `deploy` user (its key has no shell/pty/forwarding and owns only that
      # directory) and served by the `web` container. --delete keeps the tree exact — a removed app must go.
      - name: Ship dist/ to the VPS
        env:
          KEY: ${{ secrets.VPS_DEPLOY_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          KNOWN: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" dist/ "deploy@$HOST:/srv/www/"
          # verify through the PUBLIC URL: the launcher and one app must answer with the build we just sent
          sleep 2
          curl -fsS -o /dev/null https://dreamstudio.mooo.com/store/
          test "$(curl -fsS https://dreamstudio.mooo.com/_rt/build.js)" = "$(cat dist/_rt/build.js)"
