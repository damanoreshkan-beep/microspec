circle cx="807.79" cy="11.45" r="0.7" fill="#5CE4DC" opacity="0.41" class="breathe" style="animation-delay:-3.89s"/></g>
<rect x="40" y="70" width="270" height="190" rx="16" fill="#F2B84B" fill-opacity="0.03" stroke="rgba(255,232,196,.14)" stroke-opacity="1"/><path d="M 56 70.5 H 294" stroke="rgba(255,238,208,.22)"/><text x="58" y="98" class="h" font-size="13" fill="#F2B84B">THE CORE · RUNTIME.CSS</text><text x="58" y="116" class="m">structure + a neutral default</text><text x="58" y="144" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">--ms-* ladder, chrome contract</text><text x="58" y="164" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">fit · split · watch rules</text><text x="58" y="184" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">sf-* surface SYSTEM (what a class means)</text><text x="58" y="204" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">hooks: lip, garland, empty, theme-art</text><text x="58" y="224" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">every token has a plain value</text><rect x="345" y="70" width="270" height="190" rx="16" fill="#5CE4DC" fill-opacity="0.06" stroke="#5CE4DC" stroke-opacity="0.8"/><path d="M 361 70.5 H 599" stroke="rgba(255,238,208,.22)"/><text x="363" y="98" class="h" font-size="13" fill="#5CE4DC">THE PRODUCT · RT/THEME.CSS</text><text x="363" y="116" class="m">@import "./runtime.css" + the brand</text><text x="363" y="144" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">the pair of light, two palettes</text><text x="363" y="164" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">material token VALUES (rim · bloom)</text><text x="363" y="184" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">sprites in rt/ds-*.webp</text><text x="363" y="204" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">portal chrome geometry, enclosure</text><text x="363" y="224" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">tests in rt/tests/theme_test.js</text><rect x="650" y="70" width="270" height="190" rx="16" fill="#F2B84B" fill-opacity="0.03" stroke="rgba(255,232,196,.14)" stroke-opacity="1"/><path d="M 666 70.5 H 904" stroke="rgba(255,238,208,.22)"/><text x="668" y="98" class="h" font-size="13" fill="#F2B84B">THE PAGE</text><text x="668" y="116" class="m">&lt;link href="/_rt/theme.css"&gt;</text><text x="668" y="144" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">no brand → the core's theme.css</text><text x="668" y="164" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">  (one line: @import runtime.css)</text><text x="668" y="184" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">a brand → the overlay REPLACES it</text><text x="668" y="204" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">  by name: gate server + build alike</text><text x="668" y="224" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">sw precache follows the @import</text><path d="M 310 246 C 324 246, 331 246, 345 246" fill="none" stroke="#5CE4DC" stroke-opacity="0.55" stroke-width="1.4"/><path d="M 310 246 C 324 246, 331 246, 345 246" fill="none" stroke="#5CE4DC" stroke-opacity="0.95" stroke-width="1.4" class="flow"/><path d="M 615 246 C 629 246, 636 246, 650 246" fill="none" stroke="#5CE4DC" stroke-opacity="0.55" stroke-width="1.4"/><path d="M 615 246 C 629 246, 636 246, 650 246" fill="none" stroke="#5CE4DC" stroke-opacity="0.95" stroke-width="1.4" class="flow"/><g><circle cx="310" cy="246" r="15" fill="#5CE4DC" opacity="0.85" filter="url(#bloom)" class="beat" style="animation-delay:-0s"/><circle cx="310" cy="246" r="5" fill="#5CE4DC"/></g><g><circle cx="345" cy="246" r="9" fill="#F2B84B" opacity="0.5" filter="url(#bloom)" class="breathe" style="animation-delay:-0s"/><circle cx="345" cy="246" r="3.2" fill="#F2B84B"/></g><g><circle cx="615" cy="246" r="15" fill="#5CE4DC" opacity="0.85" filter="url(#bloom)" class="beat" style="animation-delay:-0s"/><circle cx="615" cy="246" r="5" fill="#5CE4DC"/></g><g><circle cx="650" cy="246" r="9" fill="#F2B84B" opacity="0.5" filter="url(#bloom)" class="breathe" style="animation-delay:-0s"/><circle cx="650" cy="246" r="3.2" fill="#F2B84B"/></g><text x="40" y="42" class="m" text-anchor="start">THEME SPLIT · DOCS/RESEARCH/THEME-SPLIT.MD</text><text x="920" y="42" class="h" text-anchor="end">a brand change is a product commit, not a core release</text></svg>
