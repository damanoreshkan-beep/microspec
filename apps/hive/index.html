<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2A2A2E">
  <title>Соти</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    html,body{background:var(--color-base-200,#2A2A2E)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#2A2A2E);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#2A2A2E);box-shadow:3px 3px 6px var(--nm-dark,#1A1A1E),-3px -3px 6px var(--nm-light,#3A3A3E)}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#ececee);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#ececee) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--color-primary,#ececee);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#2A2A2E);box-shadow:3px 3px 6px var(--nm-dark,#1A1A1E),-3px -3px 6px var(--nm-light,#3A3A3E)}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <style>
    /* The living comb. Every motion is transform/opacity (compositor-only) and every transition names its
       property. SVG transform-origin is browser-divergent unless pinned, so every transformed group pins
       transform-box + origin explicitly. Under the gate the view omits the entrance classes, so shots are
       deterministic; prefers-reduced-motion switches the whole system off. */
    .hv-scale{transform-box:view-box;transform-origin:0 0;transition:transform .7s cubic-bezier(.22,1,.36,1)}
    .hv-cell{transition:transform .62s cubic-bezier(.22,1,.36,1)}
    .hv-fill{transform-box:fill-box;transform-origin:center;transition:transform .5s cubic-bezier(.34,1.4,.64,1)}
    .hv-in{transform-box:fill-box;transform-origin:center;animation:hvBloom .45s cubic-bezier(.22,1,.36,1) backwards}
    @keyframes hvBloom{from{opacity:0;transform:scale(.55)}}
    .hv-e-in{animation:hvFadeIn .5s ease-out backwards}
    @keyframes hvFadeIn{from{opacity:0}}
    .hv-dot-live{animation:hvBeat 1.6s ease-in-out infinite}
    @keyframes hvBeat{0%,100%{opacity:1}50%{opacity:.25}}
    .hv-petal{transition:d .35s ease-out}
    /* The dial follows the magnetometer through a SHORT linear blend (the farm compass's own idiom,
       apps/compass uses duration-100): sensor events arrive in discrete steps and an un-eased dial
       judders at every one. The angle it receives is UNWRAPPED in the view, so 359°→1° can never animate
       the long way round. The needle blends faster than before (.2s): at .5s it visibly swam against the
       turning dial instead of holding its world direction. */
    .hv-dial{transform-box:view-box;transform-origin:50% 50%;transition:transform .1s linear}
    .hv-rose{transform-box:view-box;transform-origin:50% 50%;transition:transform .2s cubic-bezier(.22,1,.36,1)}
    @media(prefers-reduced-motion:reduce){
      .hv-scale,.hv-cell,.hv-fill,.hv-petal,.hv-rose,.hv-dial{transition:none}
      .hv-in,.hv-e-in,.hv-dot-live{animation:none}
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2"
    }
  }
  </script>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Соти</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
