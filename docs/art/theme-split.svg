  <radialGradient id="key" cx="50%" cy="-10%" r="80%"><stop offset="0" stop-color="#F2B84B" stop-opacity=".09"/><stop offset="1" stop-color="#F2B84B" stop-opacity="0"/></radialGradient>
  <linearGradient id="pair" x1="0" x2="1"><stop offset="0" stop-color="#F2B84B"/><stop offset="1" stop-color="#5CE4DC"/></linearGradient>
</defs>
