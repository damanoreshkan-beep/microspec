<rect x="40" y="70" width="260" height="190" rx="16" fill="none" stroke="rgba(255,232,196,.14)"/><path d="M 56 70.5 H 284" stroke="rgba(255,238,208,.22)"/><text x="60" y="98" class="h" font-size="13">FILE REALM</text><text x="60" y="116" class="m">a checkout · node_modules</text><text x="60" y="146" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">/_rt/*.js served from FILES</text><text x="60" y="168" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">the build copies from here</text><text x="60" y="190" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">code under node_modules = npm realm:</text><text x="60" y="212" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">jsr: / https imports refused</text><rect x="350" y="70" width="260" height="190" rx="16" fill="none" stroke="rgba(255,232,196,.14)"/><path d="M 366 70.5 H 594" stroke="rgba(255,238,208,.22)"/><text x="370" y="98" class="h" font-size="13">REGISTRY REALM</text><text x="370" y="116" class="m">jsr:@microspec/core@&lt;v&gt;</text><text x="370" y="146" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">tools and gates EXECUTE here</text><text x="370" y="168" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">a remote importer has no import map</text><text x="370" y="190" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">and cannot import file://</text><text x="370" y="212" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">→ .microspec/ shims plant a local one</text><rect x="660" y="70" width="260" height="190" rx="16" fill="none" stroke="rgba(255,232,196,.14)"/><path d="M 676 70.5 H 904" stroke="rgba(255,238,208,.22)"/><text x="680" y="98" class="h" font-size="13">BROWSER</text><text x="680" y="116" class="m">the page's import map</text><text x="680" y="146" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">bare deps → one preact, one pin set</text><text x="680" y="168" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">@microspec/core/ → jsr (https)</text><text x="680" y="190" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">rt/ overlay → ./rt/&lt;name&gt;.js</text><text x="680" y="212" class="l" text-anchor="start" fill="#F2EEE6" fill-opacity=".82">rtmap keeps the map honest</text><path d="M 300 240 C 320 240, 330 240, 350 240" fill="none" stroke="#5CE4DC" stroke-opacity="0.55" stroke-width="1.4"/><path d="M 300 240 C 320 240, 330 240, 350 240" fill="none" stroke="#5CE4DC" stroke-opacity="0.95" stroke-width="1.4" class="flow"/><path d="M 610 240 C 630 240, 640 240, 660 240" fill="none" stroke="#5CE4DC" stroke-opacity="0.55" stroke-width="1.4"/><path d="M 610 240 C 630 240, 640 240, 660 240" fill="none" stroke="#5CE4DC" stroke-opacity="0.95" stroke-width="1.4" class="flow"/><g><circle cx="300" cy="240" r="15" fill="#5CE4DC" opacity="0.85" filter="url(#bloom)" class="beat" style="animation-delay:-0s"/><circle cx="300" cy="240" r="5" fill="#5CE4DC"/></g><g><circle cx="350" cy="240" r="9" fill="#F2B84B" opacity="0.5" filter="url(#bloom)" class="breathe" style="animation-delay:-0s"/><circle cx="350" cy="240" r="3.2" fill="#F2B84B"/></g><g><circle cx="610" cy="240" r="15" fill="#5CE4DC" opacity="0.85" filter="url(#bloom)" class="beat" style="animation-delay:-0s"/><circle cx="610" cy="240" r="5" fill="#5CE4DC"/></g><g><circle cx="660" cy="240" r="9" fill="#F2B84B" opacity="0.5" filter="url(#bloom)" class="breathe" style="animation-delay:-0s"/><circle cx="660" cy="240" r="3.2" fill="#F2B84B"/></g><text x="40" y="42" class="m" text-anchor="start">REALM LAWS · DOCS/RESEARCH/PACKAGE-DISTRIBUTION.MD</text><text x="920" y="42" class="h" text-anchor="end">rtmap · realmlint · preflight</text></svg>
