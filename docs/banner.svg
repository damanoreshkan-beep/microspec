<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="microspec — the core of DreamStudio: AI-authored micro-PWAs that pass the gates">
  <defs>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B84B"/>
      <stop offset="1" stop-color="#5CE4DC"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2B84B" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#F2B84B" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      @keyframes breathe { 0%,100% { opacity:.35 } 50% { opacity:.85 } }
      @keyframes track   { 0% { stroke-dashoffset:36 } 100% { stroke-dashoffset:0 } }
      @keyframes tick    { 0%,72% { opacity:.35 } 80%,100% { opacity:1 } }
      .halo  { animation: breathe 3.6s ease-in-out infinite }
      .flow  { stroke-dasharray:4 14; animation: track 1.1s linear infinite }
      .n1 { animation: tick 3s ease-in-out infinite }
      .n2 { animation: tick 3s ease-in-out infinite .5s }
      .n3 { animation: tick 3s ease-in-out infinite 1s }
      @media (prefers-reduced-motion: reduce) { .halo,.flow,.n1,.n2,.n3 { animation:none } .halo{opacity:.6} }
    </style>
  </defs>

  <rect width="900" height="260" rx="22" fill="#000000"/>
  <rect x="1.5" y="1.5" width="897" height="257" rx="21" fill="none" stroke="#FFE8C4" stroke-opacity="0.11"/>
  <path d="M60 1.5 H840" stroke="#FFEED0" stroke-opacity="0.2"/>

  <!-- the amber bloom behind the wordmark — light is the structure (docs/research/luminous-icons.md) -->
  <ellipse class="halo" cx="450" cy="104" rx="360" ry="120" fill="url(#halo)" filter="url(#soft)"/>

  <!-- wordmark -->
  <text x="450" y="120" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="800" font-size="92" letter-spacing="-3" fill="url(#neon)">microspec</text>
  <text x="450" y="164" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="19" letter-spacing="0.5" fill="#F2EEE6">the core of DreamStudio — AI-authored micro-PWAs; a broken one can't reach the site</text>

  <!-- the pipeline: author -> gate -> ship, a pulse of light travelling the track -->
  <g transform="translate(0,214)" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-weight="600" font-size="13" fill="#A39E94">
    <line class="flow" x1="250" y1="0" x2="418" y2="0" stroke="#F2B84B" stroke-width="2.4" stroke-linecap="round"/>
    <line class="flow" x1="482" y1="0" x2="650" y2="0" stroke="#F2B84B" stroke-width="2.4" stroke-linecap="round"/>
    <g class="n1"><circle cx="250" cy="0" r="6" fill="#F2B84B"/><text x="250" y="26" text-anchor="middle">spec</text></g>
    <g class="n2"><circle cx="450" cy="0" r="7" fill="none" stroke="#F2B84B" stroke-width="2.4"/><circle cx="450" cy="0" r="2.6" fill="#5CE4DC"/><text x="450" y="26" text-anchor="middle">gate</text></g>
    <g class="n3"><circle cx="650" cy="0" r="6" fill="#5CE4DC"/><text x="650" y="26" text-anchor="middle">ship</text></g>
  </g>
</svg>
