name: verify

# The gate. Runtime is off-device — CI is the only place Chromium runs (visual gates need ~1GB RAM).
# unit: browser-free logic + schema contract. verify: one Chromium job per app (axe + responsive + e2e).

# push and pull_request must NOT both fire for the same commit, or verify runs TWICE in parallel: a branch
# push and its open PR are different events with different github.ref (refs/heads/… vs refs/pull/N/merge),
# so they land in different concurrency groups and neither cancels the other → two full Chromium matrices.
# So: PRs are covered by `pull_request`; `push` is scoped to `main` ONLY (its verify run is also what
# `deploy.yml` gates on via workflow_run). A feature-branch push without a PR verifies via workflow_dispatch.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # Per-PR (refs/pull/N/merge) and main are each a stable group, so a newer push supersedes an in-flight run.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    # Fail fast on a hung/broken run (incl. a GitHub action-download outage stuck in "Set up job"):
    # cap the whole job so it can't burn runner minutes retrying. Real work here is well under a minute.
    timeout-minutes: 4
    outputs:
      apps: ${{ steps.discover.outputs.apps }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need history to diff the pushed range for the changed-apps matrix
      - uses: ./.github/actions/setup-deno
      - name: Cache deno deps (DENO_DIR, keyed on the lockfile)
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock', 'packages/**/deno.json') }}
          restore-keys: deno-
      - name: Runtime unit tests (pure logic, no browser)
        run: deno test -A packages/runtime/runtime_test.js
      - name: Schema contract gate (ajv) over every app spec
        run: deno run -A packages/schema/validate.mjs apps/*/spec.json
      - name: Runtime files import each other relatively (absolute /_rt/ 404s at a subpath like /microspec/)
        run: |
          # runtime MODULES must import relatively; *_test.js is exempt (fixtures legitimately embed "/_rt/…" strings).
          if grep -rn 'from "/_rt/' packages/runtime/*.js | grep -v '_test\.js:'; then echo "::error::runtime files must use relative imports (./x.js), not /_rt/ — absolute breaks on GitHub Pages"; exit 1; fi
      - name: Gate efficacy (mutation-test the preflight gate — fail on any escape)
        run: deno run -A packages/gates/efficacy.mjs --ci
      - name: Authorless conformance (a deterministic no-LLM generator produces a passing app)
        run: deno run -A packages/gen/authorless.mjs recipes/books.json --check
      - name: App-count claims match the farm (a stale README is a claim nobody measured)
        run: deno run -A deploy/counts.mjs --check
      - name: Build check (dist assembles)
        run: deno run -A deploy/build.mjs
      - name: Discover apps to verify (affected-only, from the REAL import graph — tools/affected.mjs)
        id: discover
        run: |
          # Deno-native affected detection: an app is verified only if a changed file is in its actual import
          # closure (view.js → /_rt/… it imports) or its own dir. A shared-bootstrap / harness / config change
          # widens to the whole farm; a runtime module only reverifies the apps that import it. No node_modules,
          # no Turborepo/Nx — the farm IS the framework. See tools/graph.mjs (unit-tested in runtime_test.js).
          BEFORE="${{ github.event.pull_request.base.sha || github.event.before }}"
          RANGE=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE="${BEFORE}...${{ github.sha }}"
          fi

          if [ -z "$RANGE" ]; then
            echo "no usable diff base ('$BEFORE') → whole farm"
            APPS=$(deno run -A tools/affected.mjs --all)
          else
            echo "changed files:"; git diff --name-only "$RANGE" | sed 's/^/  /'
            APPS=$(git diff --name-only "$RANGE" | deno run -A tools/affected.mjs)
          fi

          [ -z "$APPS" ] && APPS="[]"   # empty → verify job skips (nothing app-relevant changed)
          echo "verify matrix → $APPS"
          echo "apps=$APPS" >> "$GITHUB_OUTPUT"

  verify:
    runs-on: ubuntu-latest
    needs: unit
    if: ${{ needs.unit.outputs.apps != '[]' }}  # nothing app-relevant changed → skip the whole matrix
    # Cap the whole job: normal run is ~2min (chrome+xvfb setup + ~5s gate); this kills a stuck setup
    # (e.g. GitHub action-download outage) or a hung browser instead of letting it drag ~4min and waste
    # runner minutes across the whole matrix.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.unit.outputs.apps) }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-deno
      - name: Cache deno deps (DENO_DIR, keyed on the lockfile)
        uses: actions/cache@v6
        with:
          path: ~/.cache/deno
          key: deno-${{ hashFiles('deno.lock', 'packages/**/deno.json') }}
          restore-keys: deno-
      - name: Verify ${{ matrix.app }}
        # Chrome is preinstalled on the runner (no setup-chrome download) and we run headless (no Xvfb / no
        # apt-get) — that removes ~25s of per-job setup. The gate itself is ~5s; 2min fails fast on a hang.
        timeout-minutes: 2
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: deno run -A packages/gates/verify.mjs "$GITHUB_WORKSPACE/apps/${{ matrix.app }}" --shots
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: shot-${{ matrix.app }}
          path: apps/${{ matrix.app }}/states/
          if-no-files-found: warn

  # The verify-gate mutation test (expensive Chromium mutation runs) is NOT here — it moved to its own
  # nightly workflow (.github/workflows/efficacy.yml) so it never adds ~5 minutes to a push's wait.
