<!DOCTYPE html>
<html lang="uk" data-theme="signal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Reel</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5/themes.css" rel="stylesheet" type="text/css" />
  <link href="/_rt/theme.css" rel="stylesheet" type="text/css" />
  <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap" rel="stylesheet">
  <style>body{font-family:'Geist',ui-sans-serif,system-ui,sans-serif}</style>
  <style>
    /* A reel is the content — a scrollbar drawn over it is chrome the medium doesn't have. Hidden on the
       feed AND on the page itself (Chrome's overlay bar still paints over a full-bleed surface), while the
       scrolling itself stays completely native. */
    /* The feed surface is always black — in ANY theme. So while it is mounted the app bar above it must
       read light too: in signal-light the bar's own base-100 gradient never lands (the surface covers it)
       and the title rendered near-black on black, ~1.2:1. The runtime sets nothing per-tab, so the view
       flags the root with data-feed while the surface is up. */
    :root[data-feed] header.navbar{background:linear-gradient(to bottom,rgba(0,0,0,.6),rgba(0,0,0,.25) 70%,transparent)}
    :root[data-feed] header.navbar [data-title],
    :root[data-feed] header.navbar button{color:#fff}
    /* Landscape (and split-screen): the app bar comes off the feed entirely. On this surface it carries no
       control at all — reel declares no filters, has no refresh, and the desktop "open on phone" button is
       `hidden lg:` — so it is the wordmark and nothing else, floating over the picture. Measured at
       832x384: header 59px, island 51px, dock 52px = 48% of the height covered by chrome, of which the
       header is the only third that does nothing. The design system already makes exactly this call on the
       axis a watch is short of ("an app's NAME is not information at 208px wide", theme.css); a landscape
       phone is short of the same axis, and 560px is that ladder's own rung for it.
       Height only, so portrait keeps its title bar; scoped to [data-feed], so the sources and profile tabs
       are documents with a heading like every other app. --hdr-h is deliberately NOT re-declared: nothing on
       this surface reads it (the island pins to --dock-h) and a measured number may never be overwritten by
       a written one — see the chrome contract in render.js. */
    @media (max-height: 560px){
      :root[data-feed] header.navbar{display:none}
    }
    /* Noir. The filter sits on the SLIDE, not on the <video>, and that is not a style choice: the ambient
       backdrop carries its own `filter: blur()`, and `:root[data-mono] video` (0,1,1) outranks Tailwind's
       `.blur-2xl` (0,1,0) — it would replace the blur instead of adding to it. One pass over the section
       drains video, poster and backdrop while their own filters stay intact. The island is a SIBLING of
       [data-reel], so its favicon and play button keep their colour, where colour means source and action. */
    :root[data-mono] [data-reel],
    :root[data-mono] [role="dialog"] video{filter:grayscale(1)}
    html{scrollbar-width:none}
    html::-webkit-scrollbar{display:none}
    [data-scroller]{scrollbar-width:none}
    [data-scroller]::-webkit-scrollbar{width:0;height:0;display:none}
    html,body{background:var(--color-base-200,#000000)}
    #boot{position:fixed;inset:0;z-index:60;background:var(--color-base-200,#000000);opacity:1;transition:opacity .4s ease;pointer-events:none}
    #boot.gone{opacity:0}
    #boot .bh{height:3.5rem;padding-top:env(safe-area-inset-top);display:flex;align-items:center;padding-left:1rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    #boot .bm{font-family:var(--font-mono,ui-monospace,monospace);text-transform:uppercase;letter-spacing:.05em;font-weight:700;font-size:1.02rem;color:var(--color-base-content,#f2eee6);opacity:.85}
    #boot .bb{position:absolute;left:0;right:0;top:calc(3.5rem + env(safe-area-inset-top));height:2px;overflow:hidden;background:color-mix(in oklch,var(--color-base-content,#f2eee6) 8%,transparent)}
    #boot .bb i{position:absolute;top:0;height:100%;width:38%;border-radius:2px;background:var(--app-accent,#f2b84b);animation:bootslide 1.1s cubic-bezier(.4,0,.2,1) infinite}
    #boot .bd{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + .75rem);width:12rem;height:3.25rem;border-radius:1.35rem;background:var(--color-base-100,#000000);box-shadow:var(--sf-lift2,0 0 0 1px rgba(255,232,196,.11),inset 0 1px 0 rgba(255,238,208,.2))}
    @keyframes bootslide{0%{left:-38%}100%{left:100%}}
    @media(prefers-reduced-motion:reduce){#boot .bb i{animation:none;left:0;width:100%;opacity:.5}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "preact": "https://esm.sh/preact@10.27.1",
      "preact/hooks": "https://esm.sh/preact@10.27.1/hooks",
      "htm/preact": "https://esm.sh/htm@3.1.1/preact?external=preact",
      "nanostores": "https://esm.sh/nanostores@0.11.4",
      "@nanostores/persistent": "https://esm.sh/@nanostores/persistent@0.10.2?external=nanostores",
      "@nanostores/preact": "https://esm.sh/@nanostores/preact@0.5.2?external=preact,nanostores",
      "motion": "https://esm.sh/motion@11.18.2",
      "lodash-es": "https://esm.sh/lodash-es@4.17.21"
    }
  }
  </script>
</head>
<body class="bg-base-200 min-h-dvh">
  <div id="boot" aria-hidden="true"><div class="bh"><span class="bm">Reel</span></div><div class="bb"><i></i></div><div class="bd"></div></div>
  <div id="app"></div>
  <script type="module">
    import spec from "./spec.json" with { type: "json" };
    import en from "./i18n/en.json" with { type: "json" };
    import uk from "./i18n/uk.json" with { type: "json" };
    import * as views from "./view.js";
    import { start } from "/_rt/index.js";
    start({ ...spec, i18n: { en, uk } }, { views });
  </script>
</body>
</html>
