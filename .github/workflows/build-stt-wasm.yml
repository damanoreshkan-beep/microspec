name: build-stt-wasm

# Builds the MODEL-AGNOSTIC sherpa-onnx offline-ASR WebAssembly runtime for apps/tgvoice, once.
# The two output files (sherpa-onnx-wasm-web.js + .wasm) are uploaded as an artifact; download it and
# COMMIT them under apps/tgvoice/assets/ like any vendored codec (see tools/wasm/tgvoice/README.md).
# Rebuild only when bumping the pinned sherpa-onnx ref. Never runs on push — it is heavy and manual.

on:
  workflow_dispatch:
    inputs:
      sherpa_ref:
        description: 'sherpa-onnx git tag to build (pinned in the recipe by default)'
        required: false
        default: 'v1.13.6'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60           # ORT static-lib download + a full emscripten link is tens of minutes
    steps:
      - uses: actions/checkout@v5

      # sherpa-onnx pins emscripten 4.0.23 — "other versions may not work" (build-wasm-simd-web.sh).
      - name: Set up emscripten 4.0.23
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.23

      - name: Build sherpa-onnx wasm/web
        env:
          SHERPA_REF: ${{ github.event.inputs.sherpa_ref }}
        run: bash tools/wasm/tgvoice/build.sh

      - name: The artifact is the two model-agnostic files, nothing else
        run: ls -lh apps/tgvoice/assets/sherpa-onnx-wasm-web.*

      - uses: actions/upload-artifact@v4
        with:
          name: stt-wasm
          path: |
            apps/tgvoice/assets/sherpa-onnx-wasm-web.js
            apps/tgvoice/assets/sherpa-onnx-wasm-web.wasm
            apps/tgvoice/assets/sherpa-onnx-asr.js
          if-no-files-found: error
