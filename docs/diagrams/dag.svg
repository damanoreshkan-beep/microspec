<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" role="img" aria-label="The 8n8 gate DAG: the demo node seeds generated gate material, fourteen deterministic nodes light up concurrently, every failure reported in one round.">
  <style>
    .t   { font: 600 13px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #f2ead9; }
    .s   { font: 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #a89f8d; }
    .cap { font: 600 11px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #7d7466; letter-spacing: .18em; }
    .w   { fill: none; stroke: rgba(255,232,196,.13); stroke-width: 1; }
    .dot { fill: #0A0A0D; stroke: rgba(255,232,196,.35); stroke-width: 1.4; animation: ignite 6.4s ease-in-out infinite; }
    @keyframes ignite {
      0%, 10%  { stroke: rgba(255,232,196,.35); fill: #0A0A0D; }
      16%, 72% { stroke: #3fb950; fill: #0e2214; }
      82%, 100%{ stroke: rgba(255,232,196,.35); fill: #0A0A0D; }
    }
    .seed { fill: #16110a; stroke: #F2B84B; stroke-width: 1.4; animation: seedpulse 6.4s ease-in-out infinite; }
    @keyframes seedpulse { 0%,4% { stroke-opacity:.5 } 8%,70% { stroke-opacity:1 } 84%,100% { stroke-opacity:.5 } }
    .ship { animation: shipglow 6.4s ease-in-out infinite; }
    @keyframes shipglow { 0%,60% { opacity: .35; } 72%, 88% { opacity: 1; } 100% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .dot, .seed, .ship { animation: none; } }
  </style>
  <defs>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="878" height="358" rx="16" fill="#050505" stroke="rgba(255,232,196,.14)"/>
  <text class="cap" x="32" y="36">8N8 — THE GATE DAG · CONCURRENT · ONE ROUND RETURNS THE WHOLE WORK LIST</text>

  <!-- the seed: generated gate material -->
  <g filter="url(#g2)"><rect class="seed" x="40" y="150" width="120" height="52" rx="12"/></g>
  <text class="t" x="62" y="172">demo</text>
  <text class="s" x="62" y="190">generated, not stored</text>

  <!-- fan wires -->
  <g class="w">
    <path d="M160 176 C 240 176 240 64  318 64"/>
    <path d="M160 176 C 240 176 240 100 318 100"/>
    <path d="M160 176 C 240 176 240 136 318 136"/>
    <path d="M160 176 L 318 172"/>
    <path d="M160 176 C 240 176 240 208 318 208"/>
    <path d="M160 176 C 240 176 240 244 318 244"/>
    <path d="M160 176 C 240 176 240 280 318 280"/>
    <path d="M160 176 C 240 176 240 316 318 316"/>
  </g>

  <!-- dependent gates -->
  <g>
    <circle class="dot" style="animation-delay:.2s"  cx="326" cy="60"  r="7"/><text class="s" x="344" y="64">validate — ajv over every spec</text>
    <circle class="dot" style="animation-delay:.5s"  cx="326" cy="96"  r="7"/><text class="s" x="344" y="100">preflight — render integrity, no Chromium</text>
    <circle class="dot" style="animation-delay:.8s"  cx="326" cy="132" r="7"/><text class="s" x="344" y="136">noundef — what only a browser would find</text>
    <circle class="dot" style="animation-delay:1.1s" cx="326" cy="168" r="7"/><text class="s" x="344" y="172">unit — both barrels: core + product rt/</text>
    <circle class="dot" style="animation-delay:1.4s" cx="326" cy="204" r="7"/><text class="s" x="344" y="208">caps — `needs` matches the code</text>
    <circle class="dot" style="animation-delay:1.7s" cx="326" cy="240" r="7"/><text class="s" x="344" y="244">sw — offline precache from the real graph</text>
    <circle class="dot" style="animation-delay:2s"   cx="326" cy="276" r="7"/><text class="s" x="344" y="280">readme — each app's page, regenerated</text>
    <circle class="dot" style="animation-delay:2.3s" cx="326" cy="312" r="7"/><text class="s" x="344" y="316">counts — claims measured, not typed</text>
  </g>

  <!-- independent gates -->
  <g>
    <circle class="dot" style="animation-delay:.35s" cx="642" cy="78"  r="7"/><text class="s" x="660" y="82">relimports</text>
    <circle class="dot" style="animation-delay:.65s" cx="642" cy="114" r="7"/><text class="s" x="660" y="118">kit</text>
    <circle class="dot" style="animation-delay:.95s" cx="642" cy="150" r="7"/><text class="s" x="660" y="154">shell</text>
    <circle class="dot" style="animation-delay:1.25s" cx="642" cy="186" r="7"/><text class="s" x="660" y="190">mcp</text>
    <circle class="dot" style="animation-delay:1.55s" cx="642" cy="222" r="7"/><text class="s" x="660" y="226">pipeline — the DAG checks itself</text>
  </g>

  <!-- convergence -->
  <path class="w" d="M760 150 C 800 150 800 262 806 268"/>
  <g class="ship" filter="url(#g2)">
    <rect x="742" y="262" width="112" height="44" rx="11" fill="#0e2214" stroke="#3fb950" stroke-width="1.4"/>
  </g>
  <text class="t" x="762" y="282" fill="#3fb950">all green</text>
  <text class="s" x="762" y="298" fill="#6fae7d">→ push ships</text>

  <text class="s" x="40" y="332" fill="#7d7466">~25 s on a phone.</text>
  <text class="s" x="40" y="348" fill="#7d7466">A chain stops at the first red; a DAG names every red at once.</text>
</svg>
